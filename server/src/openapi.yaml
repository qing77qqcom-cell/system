# ==================== 统计 ====================
  /api/stats/overview:
    get:
      tags: [统计]
      summary: 数据聚合规模
      parameters:
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
        - name: dept
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total: { type: integer }
                          created: { type: integer }
                          closed: { type: integer }
                          unclosed: { type: integer }
                          cancelled: { type: integer }
                          rejected: { type: integer, description: 周期内 reject_approval 动作数 }

  /api/stats/workload:
    get:
      tags: [统计]
      summary: 人员工作量（超管全员 / 部长本部门 / 员工仅本人）
      parameters:
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              type: object
                              properties:
                                userId: { type: integer }
                                name: { type: string }
                                accepted: { type: integer }
                                processed: { type: integer }
                                closed: { type: integer }
                                rejected: { type: integer }
                                cancelled: { type: integer }
                          avgPerPerson: { type: number }

  /api/stats/sla:
    get:
      tags: [统计]
      summary: SLA 超时率总览
      parameters:
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          overallRate: { type: number, description: "%" }
                          responseRate: { type: number }
                          approvalRate: { type: number }
                          processingRate: { type: number }
                          breachedCount: { type: integer }
                          avgBreachedDuration: { type: number, description: 毫秒 }

  /api/stats/sla/details:
    get:
      tags: [统计]
      summary: 超时工单明细
      parameters:
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
        - name: keyword
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: dept
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            ticketId: { type: string }
                            title: { type: string }
                            metricType: { type: string }
                            breachedDuration: { type: integer, description: 毫秒 }
                            handlerName: { type: string, nullable: true }
                            dept: { type: string }

  /api/stats/trend:
    get:
      tags: [统计]
      summary: 工单趋势（含同期对比）
      description: |
        趋势分桶粒度：day→hour，week/month→day，quarter/year→month；
        previous = 上一等长周期同期序列
      parameters:
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          current:
                            type: array
                            items:
                              type: object
                              properties:
                                bucket: { type: string }
                                created: { type: integer }
                                closed: { type: integer }
                                breached: { type: integer }
                          previous:
                            type: array
                            items:
                              type: object
                              properties:
                                bucket: { type: string }
                                created: { type: integer }
                                closed: { type: integer }
                                breached: { type: integer }

  /api/stats/status-distribution:
    get:
      tags: [统计]
      summary: 状态分布（10 态固定输出 + overdueOpen）
      parameters:
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              type: object
                              properties:
                                status: { type: string }
                                count: { type: integer }
                                ratio: { type: number, format: double }
                          overdueOpen: { type: integer, description: overall is_breached 且非终态 }

  /api/stats/export:
    get:
      tags: [统计]
      summary: 报表导出 CSV（仅超管）
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
            enum: [overview, workload, sla, trend, status]
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          description: CSV 文件流（带 UTF-8 BOM）
          content:
            text/csv:
              schema: { type: string }
        '403': { description: 无权限执行该操作 }

# ==================== 附件与健康检查 ====================
  /api/upload:
    post:
      tags: [附件与健康检查]
      summary: 附件上传
      description: |
        multipart 字段 file；上限读 system_params.upload_max_mb；
        类型白名单：.pdf/.doc/.docx/.xls/.xlsx/.ppt/.pptx/.png/.jpg/.jpeg/.gif/.txt/.zip
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name: { type: string }
                          url: { type: string }
        '400': { description: 文件类型不允许 }
        '413': { description: 附件大小超出限制 }

  /api/health:
    get:
      tags: [附件与健康检查]
      summary: 健康检查（无需登录）
      security: []
      responses:
        '200':
          description: 后端正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: up }
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: down }
                  db: { type: string, example: down }
