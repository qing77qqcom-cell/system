          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                fieldType: { type: string }
                required: { type: boolean }
                options: { type: array, items: { type: string } }
                sort: { type: integer }
                active: { type: boolean }
      responses:
        '200': { description: 成功 }

  /api/role-permissions:
    get:
