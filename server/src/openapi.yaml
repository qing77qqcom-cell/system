      summary: 字典列表（全员；返回 active 项）
      parameters:
        - name: dict_type
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            dictType: { type: string }
                            code: { type: string }
                            label: { type: string }
                            sort: { type: integer }
                            active: { type: boolean }

    post:
      tags: [系统配置]
      summary: 新增字典项（仅超管）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dictType, code, label]
              properties:
                dictType: { type: string }
                code: { type: string }
                label: { type: string }
                sort: { type: integer }
      responses:
        '201': { description: 成功 }
        '409': { description: 同类型下 code 已存在 }

  /api/dictionaries/{id}:
    put:
      tags: [系统配置]
