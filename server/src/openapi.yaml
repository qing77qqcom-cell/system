            schema:
              type: object
              properties:
                nodeName: { type: string }
                skipRule: { type: object }
                active: { type: boolean }
      responses:
        '200': { description: 成功 }

  /api/sla-rules:
    get:
      tags: [系统配置]
      summary: SLA 规则列表（含历史版本；全员）
      parameters:
        - name: ticket_type
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            ticketType: { type: string }
                            metricType: { type: string }
                            priority: { type: string, nullable: true }
                            nodeSeq: { type: integer, nullable: true }
                            targetValue: { type: number }
                            targetUnit: { type: string }
                            calendarId: { type: integer, nullable: true }
                            calendarName: { type: string, nullable: true }
                            warningThresholds: { type: array, items: { type: number } }
                            repeatRemindInterval: { type: string, nullable: true }
                            version: { type: integer }
                            active: { type: boolean }

    post:
      tags: [系统配置]
      summary: 新增规则版本（仅超管；同组自动 version+1；历史版本只读）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketType, metricType, targetValue, targetUnit]
              properties:
                ticketType: { type: string }
                metricType: { type: string }
                priority: { type: string, nullable: true }
                nodeSeq: { type: integer, nullable: true }
                targetValue: { type: number }
                targetUnit: { type: string }
                calendarId: { type: integer, nullable: true }
                warningThresholds: { type: array, items: { type: number } }
                repeatRemindInterval: { type: string }
      responses:
        '201': { description: 成功 }

  /api/sla-rules/{id}:
    patch:
      tags: [系统配置]
      summary: 启停（仅超管；版本内容不可改）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { description: 成功 }

  /api/work-calendars:
    get:
      tags: [系统配置]
      summary: 工作日历列表（全员）
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            workDays: { type: array, items: { type: integer } }
                            dayStart: { type: string }
                            dayEnd: { type: string }
                            breaks: { type: array, items: { type: array, items: { type: string } } }
                            active: { type: boolean }
                            specialDays:
                              type: array
                              items:
                                type: object
                                properties:
                                  day: { type: string, format: date }
                                  kind: { type: string, enum: [holiday, extra_workday] }
                                  name: { type: string, nullable: true }

  /api/work-calendars/{id}:
    put:
      tags: [系统配置]
      summary: 整组替换（仅超管；calendar_special_days 先删后插）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                workDays: { type: array, items: { type: integer } }
                dayStart: { type: string }
                dayEnd: { type: string }
                breaks: { type: array, items: { type: array, items: { type: string } } }
                active: { type: boolean }
                specialDays:
                  type: array
                  items:
                    type: object
                    properties:
                      day: { type: string, format: date }
                      kind: { type: string, enum: [holiday, extra_workday] }
                      name: { type: string, nullable: true }
      responses:
        '200': { description: 成功 }

  /api/form-configs:
    get:
      tags: [系统配置]
      summary: 自定义表单字段（全员；渲染提交表单用）
      parameters:
        - name: ticket_type
          in: query
          schema: { type: string }
      responses:
        '200': { description: 成功 }

    post:
      tags: [系统配置]
      summary: 新增自定义字段（仅超管）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketType, fieldKey, label, fieldType]
