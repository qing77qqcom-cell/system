      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        '200': { description: 成功 }

  /api/system-params:
    get:
      tags: [系统配置]
      summary: 系统参数列表（全员）
      responses:
        '200': { description: 成功 }

  /api/system-params/{key}:
    put:
      tags: [系统配置]
