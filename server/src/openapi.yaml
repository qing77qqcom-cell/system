                            seq: { type: integer }
                            nodeName: { type: string }
                            approverStrategy: { type: string }
                            skipRule: { type: object, nullable: true }
                            active: { type: boolean }

  /api/approval-flows/{id}:
    put:
      tags: [系统配置]
