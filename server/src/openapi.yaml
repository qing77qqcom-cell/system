                options: { type: array, items: { type: string } }
                sort: { type: integer }
      responses:
        '201': { description: 成功 }

  /api/form-configs/{id}:
    put:
      tags: [系统配置]
      summary: 编辑自定义字段（仅超管；不可物理删，active=false 下线）
      parameters:
        - name: id
          in: path
